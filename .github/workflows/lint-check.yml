name: Lint Check

# Push to main: only the cheap arch guard (R1).
# Full ruff + EvoPanel typecheck stay manual until the public-tree lint debt is cleared
# (currently 600+ ruff issues and many ChatApp TS errors — not introduced by recent PRs).
on:
  workflow_dispatch:
  push:
    branches: [ 'main' ]
  # pull_request:
  #   branches: [ '*' ]

permissions:
  contents: read

jobs:
  # Rule R1: evoflow core must not import app.* (see backend/ARCHITECTURE.md).
  # Pure stdlib — no dependency install needed.
  arch-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check kernel → app imports (R1)
        run: python backend/scripts/arch_ban_app_imports.py

  # Prompt-stack drift guard: retired tool names + dead path promises in the
  # Agent prompt stack / governance docs. Pure stdlib — no dependency install.
  prompt-drift-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check prompt stack drift (retired tools / dead paths)
        run: python backend/scripts/prompt_drift_guard.py

  # Rule R2: no name used before any binding (ruff F821).
  #
  # Distinct from the `lint` job below, which is manual-only and sits on a
  # 388-finding backlog it can never clear — so nothing ever gated on it.
  # F821 is always a runtime crash (NameError / UnboundLocalError) on the path
  # that touches it: b20b2f66 shipped `source_canon` read before its own
  # assignment and broke every task-create entry point for a day. This lane is
  # cheap and must stay green, so a new F821 fails the push.
  fatal-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install "ruff>=0.14.11"

      - name: Check for use-before-assignment (F821)
        working-directory: backend
        run: ruff check --select F821 .

  lint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        working-directory: backend
        run: |
          uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

  # 本仓库无根目录 `frontend/`；桌面端为 `evopanel/`（Vite + React，与旧 deerflow `frontend` 不同）。
  lint-evopanel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: evopanel/package-lock.json

      - name: Install & verify EvoPanel (Vite)
        working-directory: evopanel
        shell: bash
        run: |
          set -euo pipefail
          # Keep Node's bundled npm — npm@latest + mirror-resolved lockfiles → EALLOWREMOTE.
          # maxsockets + retry still mitigate npm/cli#9386 queue stalls.
          for i in 1 2 3; do
            if npm ci --maxsockets 1000 --no-audit --no-fund; then
              break
            fi
            echo "npm ci attempt $i failed, retrying..."
            rm -rf node_modules
            sleep 15
            if [[ "$i" -eq 3 ]]; then
              exit 1
            fi
          done
          npm run typecheck
          npm run test
          npm run build
