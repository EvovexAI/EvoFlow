<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>头像工坊 · Avatar Studio</title>
<style>
  :root{
    --ink:#2C2431;
    --ink-2:#5B4F63;
    --muted:#9A8FA3;
    --line:#F0E7EE;
    --bg:#FFFBF9;
    --card:#FFFFFF;
    --accent:#FF6F91;
    --accent-2:#FFB36B;
    --accent-3:#A78BFA;
    --shadow:0 10px 34px rgba(214,140,160,.12);
    --shadow-sm:0 4px 14px rgba(214,140,160,.10);
    --r-lg:26px;
    --r-md:18px;
    --r-sm:13px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 8% -10%, #FFE7EF 0%, rgba(255,231,239,0) 60%),
      radial-gradient(900px 620px at 100% 0%, #EAF3FF 0%, rgba(234,243,255,0) 55%),
      radial-gradient(900px 700px at 50% 110%, #FFF3E2 0%, rgba(255,243,226,0) 60%),
      var(--bg);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:26px 24px 60px}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .logo{
    width:46px;height:46px;border-radius:15px;flex:none;
    background:linear-gradient(140deg,#FF8FB0,#FFB36B 55%,#B79BFB);
    box-shadow:0 8px 20px rgba(255,143,176,.35);
    display:grid;place-items:center;
  }
  .logo svg{width:26px;height:26px}
  .titles h1{font-size:20px;margin:0;letter-spacing:.2px;font-weight:700}
  .titles p{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
  .top-spacer{flex:1}
  .badge{
    font-size:12px;color:#B4638A;background:#FFF0F6;border:1px solid #FFDFEC;
    padding:7px 13px;border-radius:999px;font-weight:600;letter-spacing:.2px;
  }

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:22px;align-items:start}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}

  /* ---------- stage ---------- */
  .stage{position:sticky;top:24px}
  .canvas{
    position:relative;border-radius:var(--r-lg);padding:18px;
    background:linear-gradient(160deg,#FFFFFF,#FFF9FB 60%,#FFF6F0);
    box-shadow:var(--shadow);border:1px solid #FBEEF3;
    display:grid;place-items:center;overflow:hidden;
  }
  .canvas::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(420px 260px at 50% 0%,rgba(255,255,255,.75),transparent 70%);
  }
  #stage{width:100%;max-width:540px;display:block;border-radius:20px;overflow:hidden;
    box-shadow:0 14px 40px rgba(120,90,120,.13);}
  #stage svg{display:block;width:100%;height:auto}

  .stage-bar{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.2px;
    padding:11px 16px;border-radius:13px;cursor:pointer;transition:.16s ease;
    display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)
  }
  .btn:hover{transform:translateY(-1px);border-color:#F3D7E2;box-shadow:0 8px 20px rgba(214,140,160,.16)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn.primary{
    border:none;color:#fff;
    background:linear-gradient(135deg,#FF7C9E,#FF9E7A 55%,#FFB36B);
    box-shadow:0 10px 24px rgba(255,124,158,.34);flex:1;justify-content:center;
  }
  .btn.primary:hover{box-shadow:0 14px 30px rgba(255,124,158,.42)}
  .btn svg{width:16px;height:16px;flex:none;opacity:.9}
  .btn.primary svg{opacity:1}

  .seedbar{
    margin-top:12px;display:flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--muted);flex-wrap:wrap
  }
  .seedbar code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    color:#7A6B85;background:#F8F2F6;border:1px solid #F1E5ED;
    padding:5px 10px;border-radius:9px;letter-spacing:.4px
  }
  .link{color:#B4638A;cursor:pointer;text-decoration:none;font-weight:600;border-bottom:1px dashed #E8C4D6;padding-bottom:1px}
  .link:hover{color:#8F3C68}

  /* ---------- panel ---------- */
  .panel{
    background:var(--card);border-radius:var(--r-lg);border:1px solid #FBEEF3;
    box-shadow:var(--shadow);padding:6px 18px 20px;
    max-height:calc(100vh - 60px);overflow:auto;overscroll-behavior:contain;
    scrollbar-width:thin;scrollbar-color:#F0DCE7 transparent;
  }
  .panel::-webkit-scrollbar{width:9px}
  .panel::-webkit-scrollbar-thumb{background:#F3DFE9;border-radius:9px;border:2px solid #fff}
  .panel::-webkit-scrollbar-track{background:transparent}

  .sect{padding:15px 0;border-bottom:1px dashed #F6ECF2}
  .sect:last-of-type{border-bottom:none}
  .sect-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .sect-head h3{
    font-size:12px;font-weight:700;letter-spacing:1.4px;color:#A795AF;
    margin:0;text-transform:uppercase
  }
  .sect-head .rule{flex:1;height:1px;background:linear-gradient(90deg,#F6EAF1,transparent)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#FAF3F7;padding:5px;border-radius:15px}
  .seg button{
    appearance:none;border:none;background:transparent;font-family:inherit;cursor:pointer;
    padding:10px 8px;border-radius:11px;font-size:13.5px;font-weight:600;color:#9A8FA3;
    transition:.18s ease;display:flex;align-items:center;justify-content:center;gap:6px
  }
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(190,140,170,.16)}
  .seg button span.ic{font-size:14px}

  .row{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
  .row:last-child{margin-bottom:0}
  .row > .lb{width:44px;flex:none;font-size:12.5px;color:#9A8FA3;padding-top:7px;letter-spacing:.3px}
  .row > .ct{flex:1;display:flex;flex-wrap:wrap;gap:7px}

  .sw{
    width:27px;height:27px;border-radius:50%;cursor:pointer;border:none;padding:0;position:relative;
    box-shadow:0 2px 6px rgba(120,90,110,.16);transition:.16s ease;
  }
  .sw:hover{transform:translateY(-2px) scale(1.06)}
  .sw.on::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    border:2px solid #FF8FB0;box-shadow:0 0 0 3px #FFF3F7
  }

  .chip{
    appearance:none;font-family:inherit;cursor:pointer;font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:#7E7189;
    transition:.16s ease;letter-spacing:.2px
  }
  .chip:hover{border-color:#F3D0DE;color:#B4638A;background:#FFF8FB}
  .chip.on{background:linear-gradient(140deg,#FFEDF3,#FFF4EC);border-color:#FFC9DB;color:#C2537B;
    box-shadow:0 3px 10px rgba(255,157,187,.18)}

  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;
    color:#8D8096;padding:7px 12px 7px 9px;border-radius:12px;border:1px solid var(--line);
    background:#fff;transition:.16s ease;user-select:none
  }
  .toggle .dot{
    width:30px;height:17px;border-radius:99px;background:#EDE3EA;position:relative;transition:.2s ease;flex:none
  }
  .toggle .dot::after{
    content:"";position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.2s cubic-bezier(.3,1.4,.5,1)
  }
  .toggle.on{color:#C2537B;border-color:#FFD3E2;background:#FFFAFC}
  .toggle.on .dot{background:linear-gradient(135deg,#FF8FB0,#FFB36B)}
  .toggle.on .dot::after{left:15px}

  /* ---------- gallery ---------- */
  .gallery{margin-top:26px}
  .g-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .g-head h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.3px}
  .g-head p{margin:0;font-size:12.5px;color:var(--muted)}
  .g-head .spacer{flex:1}
  .grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:13px
  }
  @media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  .mini{
    appearance:none;border:none;padding:0;cursor:pointer;position:relative;
    border-radius:18px;overflow:hidden;background:#fff;
    box-shadow:0 6px 18px rgba(180,130,160,.13);transition:.2s cubic-bezier(.3,1.2,.5,1);
    aspect-ratio:1/1
  }
  .mini svg{display:block;width:100%;height:100%}
  .mini:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(180,130,160,.24)}
  .mini::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    border:2px solid transparent;transition:.2s
  }
  .mini.on::after{border-color:#FF8FB0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.7)}

  .foot{margin-top:34px;text-align:center;font-size:12px;color:#BDAFBB;letter-spacing:.4px}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:#2C2431;color:#fff;font-size:13px;padding:11px 20px;border-radius:13px;
    box-shadow:0 12px 30px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.26s ease;z-index:99
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>

/* =========================================================================
   2. 工具
   ========================================================================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = v => Math.max(0,Math.min(255, Math.round(amt>0 ? v+(255-v)*amt : v*(1+amt))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function byId(list,id){ return list.find(x=>x.id===id) || list[0]; }
function wpick(rng, pairs){
  const total = pairs.reduce((a,b)=>a+b[1],0);
  let r = rng()*total;
  for(const [v,w] of pairs){ r -= w; if(r <= 0) return v; }
  return pairs[pairs.length-1][0];
}
const FACE_INK = '#3A2E40';
function star4(x,y,r,color,op){
  const k = r*0.24;
  return `<path d="M${x},${y-r} Q${x+k},${y-k} ${x+r},${y} Q${x+k},${y+k} ${x},${y+r} Q${x-k},${y+k} ${x-r},${y} Q${x-k},${y-k} ${x},${y-r} Z" fill="${color}" opacity="${op}"/>`;
}

/* =========================================================================

const DARK_BGS = new Set(['moon','forest','bloom','frost','void']);

function buildAvatar(st, uid){
  uid = uid || 'a';
  const S = byId(SKINS, st.skin);
  const H = byId(HAIRS, st.hair);
  const E = byId(EYES, st.eye);
  const B = byId(BGS, st.bg);

  const defs = `

    <radialGradient id="${uid}-skin" gradientUnits="userSpaceOnUse" cx="222" cy="176" r="212">

      <stop offset=".42" stop-color="${S.c}"/>
      <stop offset=".74" stop-color="${shade(S.c, -.10)}"/>
      <stop offset="1" stop-color="${shade(S.s, -.14)}"/>
    </radialGradient>
    <radialGradient id="${uid}-bounce" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="${S.b}" stop-opacity=".38"/>
      <stop offset="1" stop-color="${S.b}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${uid}-hair" gradientUnits="userSpaceOnUse" x1="150" y1="80" x2="330" y2="470">
      <stop offset="0" stop-color="${H.l}"/>
      <stop offset=".34" stop-color="${H.c}"/>
      <stop offset=".78" stop-color="${H.d}"/>
      <stop offset="1" stop-color="${shade(H.d, -.22)}"/>
    </linearGradient>
    <linearGradient id="${uid}-gloss" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="${uid}-iris" cx="0.46" cy="0.74" r="0.66">
      <stop offset="0" stop-color="${shade(E.c, .50)}"/>
      <stop offset=".5" stop-color="${E.c}"/>
      <stop offset=".86" stop-color="${shade(E.c, -.34)}"/>
      <stop offset="1" stop-color="${shade(E.c, -.52)}"/>
    </radialGradient>
    <radialGradient id="${uid}-sclera" cx="0.5" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".62" stop-color="#FAF5F9"/>
      <stop offset="1" stop-color="#D8CBD8"/>
    </radialGradient>
    <linearGradient id="${uid}-cloth" x1="0.25" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="${shade(cloth, .10)}"/>
      <stop offset=".6" stop-color="${cloth}"/>
      <stop offset="1" stop-color="${shade(cloth, -.14)}"/>
    </linearGradient>
    <radialGradient id="${uid}-eartip" gradientUnits="userSpaceOnUse" cx="108" cy="172" r="72">
      <stop offset="0" stop-color="${S.b}" stop-opacity=".65"/>
      <stop offset="1" stop-color="${S.b}" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="${uid}-blush" cx="0.5" cy="0.5" r="0.5">

      <stop offset=".55" stop-color="${S.b}" stop-opacity=".30"/>
      <stop offset="1" stop-color="${S.b}" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="${uid}-lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C25566"/>
      <stop offset="1" stop-color="#8E3443"/>

      <feGaussianBlur stdDeviation="4"/></filter>
    <filter id="${uid}-b8" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/></filter>

  /* ---------- 光环（精灵） ---------- */
  if(st.elfEars){
    bg += `<circle cx="256" cy="238" r="158" fill="none" stroke="${B.ac}" stroke-opacity=".30" stroke-width="1.4"/>`;
    bg += `<circle cx="256" cy="238" r="172" fill="none" stroke="${B.ac}" stroke-opacity=".14" stroke-width="1"/>`;
  }

  /* ---------- 脖子 ---------- */
  const neck = `
    <path d="M230,318 L282,318 L282,368 C282,382 271,390 256,390 C241,390 230,382 230,368 Z"
          fill="${shade(S.c,-.10)}"/>
    <ellipse cx="256" cy="382" rx="42" ry="18" fill="${shade(S.s,-.28)}" opacity=".30" filter="url(#${uid}-b8)"/>`;

  /* ---------- 身体 ---------- */
  const body = `
    <path d="M256,344 C306,344 344,362 366,388 C392,418 406,462 412,512 L100,512 C106,462 120,418 146,388
             C168,362 206,344 256,344 Z" fill="url(#${uid}-cloth)"/>
    <path d="M256,344 C306,344 344,362 366,388 C392,418 406,462 412,512 L100,512 C106,462 120,418 146,388
             C168,362 206,344 256,344 Z" fill="none" stroke="${shade(cloth,-.22)}" stroke-opacity=".25" stroke-width="1.4"/>
    <ellipse cx="256" cy="358" rx="86" ry="28" fill="#3A2440" opacity=".22" filter="url(#${uid}-b16)"/>

          fill="${shade(S.c,-.14)}"/>
    <path d="M218,348 C224,384 238,398 256,398 C274,398 288,384 294,348" fill="none"
          stroke="${shade(cloth,-.18)}" stroke-width="7" opacity=".85"/>
    <path d="M218,348 C224,384 238,398 256,398 C274,398 288,384 294,348" fill="none"
          stroke="#fff" stroke-width="2" opacity=".5"/>`;

  /* ---------- 耳朵 ---------- */
  const ears = st.elfEars
    ? `<g>${elfEar(S, uid)}</g><g transform="translate(512,0) scale(-1,1)">${elfEar(S, uid)}</g>`
    : '';

  /* ---------- 头 ---------- */
  const head = `
    <path d="M256,112 C313,112 358,158 358,224 C358,278 340,318 312,342 C296,356 277,364 256,364
             C235,364 216,356 200,342 C172,318 154,278 154,224 C154,158 199,112 256,112 Z"
          fill="url(#${uid}-skin)"/>

          stroke-linecap="round" opacity=".38" filter="url(#${uid}-b4)"/>

          stroke-linecap="round" opacity=".26" filter="url(#${uid}-b8)"/>
    <ellipse cx="256" cy="352" rx="70" ry="26" fill="${skinDeep}" opacity=".16" filter="url(#${uid}-b16)"/>`;

  /* ---------- 五官 ---------- */
  const face = faceLayer(st, S, E, H, uid);

  /* ---------- 头发 ---------- */
  const backHair = hairBack(st, H, uid);
  const frontHair = hairFront(st, H, uid);

  /* ---------- 配饰 ---------- */
  const acc = accLayer(st, H, S, uid);

  /* ---------- 光点 ---------- */
  let fx = '';
  if(st.sparkle){
    const pts = [[104,206,10],[404,244,8],[128,362,7],[392,384,9],[92,308,6],[424,326,6],[352,96,7]];
    pts.forEach(p=>{
      const jx = p[0] + (rng()-.5)*12, jy = p[1] + (rng()-.5)*12, r = p[2]*(0.75+rng()*.55);
      fx += `<circle cx="${jx.toFixed(1)}" cy="${jy.toFixed(1)}" r="${(r*1.8).toFixed(1)}" fill="#fff" opacity=".28" filter="url(#${uid}-b4)"/>`;
      fx += star4(jx, jy, r, '#fff', (.62+rng()*.3).toFixed(2));
    });
  }

  return `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
    ${defs}${bg}
    <g filter="url(#${uid}-ds)">${neck}${body}${backHair}${head}${ears}${face}${frontHair}${acc}</g>
    ${fx}
    <rect width="512" height="512" fill="url(#${uid}-vig)" pointer-events="none"/>
  </svg>`;
}

/* ---------- 背景装饰 ---------- */
function decoLayer(kind, ac, rng){
  let s = '';
  if(kind === 'soft'){
    s += `<circle cx="86" cy="120" r="118" fill="#fff" opacity=".45"/>`;
    s += `<circle cx="436" cy="410" r="150" fill="#fff" opacity=".30"/>`;
    s += `<circle cx="412" cy="96" r="58" fill="${ac}" opacity=".30"/>`;
  }
  if(kind === 'bokeh'){
    [[66,92,48],[436,148,64],[112,424,56],[404,398,42],[300,54,28]].forEach(p=>{
      s += `<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="#fff" opacity=".38"/>`;
    });
    s += `<circle cx="452" cy="452" r="96" fill="${ac}" opacity=".26"/>`;
  }
  if(kind === 'dots'){
    for(let y=0;y<9;y++) for(let x=0;x<9;x++){
      s += `<circle cx="${34+x*56}" cy="${34+y*56}" r="3.4" fill="${ac}" opacity=".22"/>`;
    }
    s += `<circle cx="256" cy="240" r="196" fill="#fff" opacity=".30"/>`;
  }
  if(kind === 'cloud'){
    s += `<ellipse cx="104" cy="100" rx="92" ry="46" fill="#fff" opacity=".55"/>`;
    s += `<ellipse cx="168" cy="80" rx="56" ry="36" fill="#fff" opacity=".45"/>`;
    s += `<ellipse cx="410" cy="418" rx="100" ry="48" fill="#fff" opacity=".42"/>`;
    s += `<circle cx="434" cy="92" r="48" fill="${ac}" opacity=".28"/>`;
  }
  if(kind === 'stars'){
    s += `<circle cx="256" cy="232" r="150" fill="${ac}" opacity=".20"/>`;
  }
  if(kind === 'fireflies'){
    for(let i=0;i<14;i++){
      const x = rng()*512, y = rng()*512, r = 5 + rng()*7;
      s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(1)}" fill="${ac}" opacity=".55"/>`;
    }
    s += `<circle cx="256" cy="250" r="170" fill="${ac}" opacity=".12"/>`;
  }
  if(kind === 'petals'){
    for(let i=0;i<12;i++){
      const x = rng()*512, y = rng()*512, r = 6 + rng()*8, a = rng()*360;
      s += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${r.toFixed(1)}" ry="${(r*.6).toFixed(1)}"
             fill="${ac}" opacity="${(.30+rng()*.35).toFixed(2)}" transform="rotate(${a.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
    s += `<circle cx="256" cy="240" r="158" fill="${ac}" opacity=".10"/>`;
  }
  if(kind === 'ring'){
    s += `<circle cx="256" cy="240" r="190" fill="none" stroke="${ac}" stroke-opacity=".45" stroke-width="2"/>`;
    s += `<circle cx="256" cy="240" r="150" fill="${ac}" opacity=".14"/>`;
  }
  return s;
}
function crispDeco(kind, ac, rng){
  let s = '';
  if(kind === 'stars'){
    [[80,124,13],[420,182,10],[100,402,9],[402,424,11],[350,68,7],[176,60,6]].forEach(p=>{
      s += star4(p[0],p[1],p[2],'#fff',.85);
    });
  }
  if(kind === 'ring'){
    s += `<circle cx="256" cy="240" r="212" fill="none" stroke="${ac}" stroke-opacity=".22" stroke-width="1.2" stroke-dasharray="3 10"/>`;
  }
  if(kind === 'dots'){
    s += `<circle cx="256" cy="240" r="196" fill="none" stroke="${ac}" stroke-opacity=".22" stroke-width="1"/>`;
  }
  return s;
}

/* ---------- 五官 ---------- */
function faceLayer(st, S, E, H, uid){
  const cy = 258, lx = 214, rx = 298;
  let s = '';

  /* 眼窝阴影 */
  s += `<ellipse cx="214" cy="236" rx="42" ry="22" fill="${shade(S.s,-.18)}" opacity=".10" filter="url(#${uid}-b8)"/>
        <ellipse cx="298" cy="236" rx="42" ry="22" fill="${shade(S.s,-.18)}" opacity=".10" filter="url(#${uid}-b8)"/>`;

  /* 眉 */
  const browY = 214;
  const browPaths = {
    soft:     `M-21,3 C-13,-8 13,-8 21,1`,
    straight: `M-21,0 C-13,-5 13,-5 21,0`,
    up:       `M-21,5 C-13,-11 13,-13 21,-1`
  };
  const bp = browPaths[st.brow] || browPaths.soft;
  [lx, rx].forEach(x=>{
    s += `<g transform="translate(${x},${browY})">
            <path d="${bp}" fill="none" stroke="${shade(H.d,-.05)}" stroke-width="6" stroke-linecap="round"
                  opacity=".40" filter="url(#${uid}-b4)"/>
            <path d="${bp}" fill="none" stroke="${shade(H.d,.04)}" stroke-width="4.2" stroke-linecap="round" opacity=".82"/>
          </g>`;
  });

  /* 眼 */
  const bothClosed = st.eyeStyle === 'sleepy';
  const closedRight = st.eyeStyle === 'wink';
  s += eye(lx, cy, st.eyeStyle, E, uid, 'L', bothClosed);
  s += eye(rx, cy, st.eyeStyle, E, uid, 'R', bothClosed || closedRight);

  /* 腮红 */
  if(st.blush){
    s += `<ellipse cx="172" cy="302" rx="34" ry="22" fill="url(#${uid}-blush)"/>
          <ellipse cx="340" cy="302" rx="34" ry="22" fill="url(#${uid}-blush)"/>
          <ellipse cx="166" cy="296" rx="7" ry="4" fill="#fff" opacity=".28" filter="url(#${uid}-b4)"/>`;
  }

  /* 精灵雀斑 */
  if(st.elfEars){
    [[198,292],[212,302],[186,308],[322,292],[310,302],[330,308]].forEach(d=>{
      s += `<circle cx="${d[0]}" cy="${d[1]}" r="2" fill="${shade(S.s,-.30)}" opacity=".45"/>`;
    });
  }

  /* 鼻子 */
  s += `<ellipse cx="256" cy="290" rx="13" ry="9" fill="${shade(S.s,-.06)}" opacity=".45" filter="url(#${uid}-b4)"/>
        <ellipse cx="256" cy="291" rx="7.5" ry="5.5" fill="${S.s}" opacity=".55" filter="url(#${uid}-b4)"/>
        <ellipse cx="252" cy="286" rx="5" ry="3.5" fill="#fff" opacity=".55" filter="url(#${uid}-b4)"/>`;

  /* 嘴 */
  s += `<ellipse cx="256" cy="330" rx="20" ry="9" fill="${shade(S.s,-.18)}" opacity=".22" filter="url(#${uid}-b4)"/>`;
  s += mouth(st.mouth, uid);
  return s;
}

function eye(cx, cy, style, E, uid, side, closed){
  if(closed){
    const d = side === 'L'
      ? `M${cx-25},${cy+2} C${cx-15},${cy+18} ${cx+15},${cy+18} ${cx+25},${cy+2}`
      : `M${cx-25},${cy+2} C${cx-15},${cy+18} ${cx+15},${cy+18} ${cx+25},${cy+2}`;
    return `<g>
      <path d="${d}" fill="none" stroke="#3A2E40" stroke-width="7" stroke-linecap="round" opacity=".92"/>
      <path d="${d}" fill="none" stroke="#3A2E40" stroke-width="3" stroke-linecap="round" opacity=".35"
            transform="translate(0,7)" filter="url(#${uid}-b4)"/>
      <path d="M${cx-30},${cy-6} C${cx-22},${cy+4} ${cx-13},${cy+6} ${cx-6},${cy+4}" fill="none"
            stroke="#3A2E40" stroke-width="4.5" stroke-linecap="round" opacity=".5"/>
    </g>`;
  }
  const clip = `url(#${uid}-eye${side})`;
  let g = `<g clip-path="${clip}">
      <ellipse cx="${cx}" cy="${cy}" rx="27" ry="29" fill="url(#${uid}-sclera)"/>
      <circle cx="${cx}" cy="${cy+1}" r="24" fill="url(#${uid}-iris)"/>
      <circle cx="${cx}" cy="${cy+1}" r="24" fill="none" stroke="${shade(E.c,-.6)}" stroke-opacity=".5" stroke-width="1.8"/>
      <circle cx="${cx}" cy="${cy+3}" r="10.4" fill="#211A26"/>
      <ellipse cx="${cx}" cy="${cy+14}" rx="13" ry="7" fill="${shade(E.c,.62)}" opacity=".4" filter="url(#${uid}-b4)"/>
      <circle cx="${cx-8}" cy="${cy-10}" r="8.4" fill="#fff" opacity=".97"/>
      <circle cx="${cx-11}" cy="${cy-13}" r="3" fill="#fff"/>
      <circle cx="${cx+9}" cy="${cy+11}" r="3.6" fill="#fff" opacity=".72"/>
      <ellipse cx="${cx}" cy="${cy-26}" rx="30" ry="13" fill="#5A4A5E" opacity=".28" filter="url(#${uid}-b4)"/>
    </g>`;
  if(style === 'sparkle'){
    g += `<path d="M${cx},${cy-12} L${cx+4},${cy-4} L${cx+12},${cy} L${cx+4},${cy+4}
                   L${cx},${cy+12} L${cx-4},${cy+4} L${cx-12},${cy} L${cx-4},${cy-4} Z"
            fill="#FFF8DE"/>`;
  }
  // 睫毛（上眼睑）
  g += `<path d="M${cx-27},${cy-6} C${cx-22},${cy-30} ${cx+22},${cy-30} ${cx+27},${cy-6}"
          fill="none" stroke="#3A2E40" stroke-width="8" stroke-linecap="round"/>
        <path d="M${cx-24},${cy-11} C${cx-18},${cy-29} ${cx+18},${cy-29} ${cx+24},${cy-11}"
          fill="none" stroke="#6B5A6E" stroke-width="2.2" stroke-linecap="round" opacity=".45"/>
        <path d="M${cx-16},${cy+27} C${cx-7},${cy+31} ${cx+7},${cy+31} ${cx+16},${cy+27}"
          fill="none" stroke="#3A2E40" stroke-width="1.8" stroke-linecap="round" opacity=".14"/>`;
  return g;
}

function mouth(kind, uid){

/* ---------- 配饰 ---------- */

                  fill="#FFFDF8" transform="rotate(${i*72} ${px.toFixed(1)} ${py.toFixed(1)})"/>

                  fill="#fff" opacity=".9" transform="rotate(${i*72} ${px.toFixed(1)} ${py.toFixed(1)})"/>`;

/* =========================================================================
   5. 渲染与交互
   ========================================================================= */
const stageEl = document.getElementById('stage');
const panelEl = document.getElementById('panel');
const gridEl  = document.getElementById('grid');
const seedTxt = document.getElementById('seed-txt');

function render(){
  stageEl.innerHTML = buildAvatar(state, 'stage');
  seedTxt.textContent = String(state.seed);
  syncPanel();
}

function renderMinis(){
  gridEl.innerHTML = miniSeeds.map((seed,i)=>{
    const s = {...state, seed};
    const rng = mulberry32(seed);
    // 让每张也有变化：随机部件
    const pack = state.pack;
    const P = PACKS[pack];
    s.skin = P.skins[Math.floor(rng()*P.skins.length)];
    s.hair = P.hairs[Math.floor(rng()*P.hairs.length)];
    s.eye  = P.eyes[Math.floor(rng()*P.eyes.length)];
    s.bg   = P.bgs[Math.floor(rng()*P.bgs.length)];
    s.clothes = Math.floor(rng()*CLOTHES.length);
    s.acc  = P.accs[Math.floor(rng()*P.accs.length)];
    s.hairStyle = P.styles[Math.floor(rng()*P.styles.length)];
    s.bangs = P.bangs[Math.floor(rng()*P.bangs.length)];
    s.eyeStyle = wpick(rng, EYE_WEIGHTS);
    s.mouth = wpick(rng, MOUTH_WEIGHTS);
    s.brow = BROWS[Math.floor(rng()*BROWS.length)].id;
    s.elfEars = pack === 'elf' ? true : rng() > .72;
    s.blush = rng() > .12;
    s.sparkle = rng() > .3;
    return `<button class="mini${selectedMini===i?' on':''}" data-i="${i}" title="采用这个">
              ${buildAvatar(s, 'm'+i)}
            </button>`;
  }).join('');
  gridEl.querySelectorAll('.mini').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.i;
      const seed = miniSeeds[i];
      const rng = mulberry32(seed);
      const P = PACKS[state.pack];
      state = {
        ...state, seed,
        skin: P.skins[Math.floor(rng()*P.skins.length)],
        hair: P.hairs[Math.floor(rng()*P.hairs.length)],
        eye:  P.eyes[Math.floor(rng()*P.eyes.length)],
        bg:   P.bgs[Math.floor(rng()*P.bgs.length)],
        clothes: Math.floor(rng()*CLOTHES.length),
        acc:  P.accs[Math.floor(rng()*P.accs.length)],
        hairStyle: P.styles[Math.floor(rng()*P.styles.length)],
        bangs: P.bangs[Math.floor(rng()*P.bangs.length)],
        eyeStyle: wpick(rng, EYE_WEIGHTS),
        mouth: wpick(rng, MOUTH_WEIGHTS),
        brow: BROWS[Math.floor(rng()*BROWS.length)].id,
        elfEars: state.pack === 'elf' ? true : rng() > .72
      };
      selectedMini = i;
      render(); renderMinis();
      toast('已采用第 ' + (i+1) + ' 个');
    };
  });
}

/* ---------- 控制面板 ---------- */
function buildPanel(){
  const P = PACKS[state.pack];
  const skins = SKINS.filter(s=>P.skins.includes(s.id));
  const hairs = HAIRS.filter(s=>P.hairs.includes(s.id));
  const eyes  = EYES.filter(s=>P.eyes.includes(s.id));
  const bgs   = BGS.filter(s=>P.bgs.includes(s.id));

  const swatches = (list, key, colorFn, title) =>
    `<div class="row"><div class="lb">${title}</div><div class="ct">
      ${list.map(x=>`<button class="sw" data-k="${key}" data-v="${x.id}"
        style="background:${colorFn(x)}" title="${x.name}"></button>`).join('')}
    </div></div>`;

  const chips = (list, key, title) =>
    `<div class="row"><div class="lb">${title}</div><div class="ct">
      ${list.map(x=>`<button class="chip" data-k="${key}" data-v="${x.id}">${x.name}</button>`).join('')}
    </div></div>`;

  panelEl.innerHTML = `
    <div class="sect" style="padding-top:18px">
      <div class="seg" id="packSeg">
        <button data-pack="cute" class="${state.pack==='cute'?'on':''}"><span class="ic">🌸</span>可爱系</button>
        <button data-pack="elf"  class="${state.pack==='elf'?'on':''}"><span class="ic">🧝</span>精灵系</button>
      </div>
    </div>

    <div class="sect">
      <div class="sect-head"><h3>五官</h3><div class="rule"></div></div>
      ${swatches(skins,'skin',x=>`linear-gradient(145deg,${x.c},${x.s})`,'肤色')}
      ${chips(EYE_STYLES,'eyeStyle','眼型')}
      ${swatches(eyes,'eye',x=>x.c,'瞳色')}
      ${chips(BROWS,'brow','眉形')}
      ${chips(MOUTHS,'mouth','嘴型')}
    </div>

    <div class="sect">
      <div class="sect-head"><h3>头发</h3><div class="rule"></div></div>
      ${chips(HAIR_STYLES,'hairStyle','发型')}
      ${chips(BANGS,'bangs','刘海')}
      ${swatches(hairs,'hair',x=>`linear-gradient(145deg,${x.l},${x.d})`,'发色')}
    </div>

    <div class="sect">
      <div class="sect-head"><h3>装饰</h3><div class="rule"></div></div>
      ${chips(ACCS.filter(a=>P.accs.includes(a.id)),'acc','配饰')}
      ${swatches(bgs,'bg',x=>`linear-gradient(145deg,${x.c1},${x.c2})`,'背景')}
      <div class="row"><div class="lb">细节</div><div class="ct">
        <div class="toggle" data-toggle="elfEars"><span class="dot"></span>精灵耳</div>
        <div class="toggle" data-toggle="blush"><span class="dot"></span>腮红</div>
        <div class="toggle" data-toggle="sparkle"><span class="dot"></span>光点</div>
      </div></div>
      <div class="row"><div class="lb">配色</div><div class="ct">
        ${CLOTHES.map((c,i)=>`<button class="sw" data-k="clothes" data-v="${i}" style="background:${c};box-shadow:inset 0 0 0 1.5px #EFE6EE" title="第${i+1}套"></button>`).join('')}
      </div></div>
    </div>

    <div class="sect">
      <div class="sect-head"><h3>种子</h3><div class="rule"></div></div>
      <div class="row"><div class="lb">复现</div><div class="ct" style="align-items:center;gap:8px">
        <input id="seedInput" value="${state.seed}" style="flex:1;min-width:120px;font-family:ui-monospace,monospace;
          font-size:13px;padding:9px 12px;border-radius:11px;border:1px solid #F0E7EE;background:#FFFBFD;color:#5B4F63;outline:none"/>
        <button class="chip" id="btn-apply-seed">套用</button>
      </div></div>
    </div>
  `;

  // 交互
  panelEl.querySelectorAll('[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k;
      let v = el.dataset.v;
      if(k === 'clothes') v = +v;
      state[k] = v;
      render();
    };
  });
  panelEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.toggle;
      state[k] = !state[k];
      render();
    };
  });
  panelEl.querySelectorAll('[data-pack]').forEach(el=>{
    el.onclick = ()=>{
      if(state.pack === el.dataset.pack) return;
      state.pack = el.dataset.pack;
      state.elfEars = PACKS[state.pack].elfEars;
      const P = PACKS[state.pack];
      if(!P.skins.includes(state.skin)) state.skin = P.skins[0];
      if(!P.hairs.includes(state.hair)) state.hair = P.hairs[0];
      if(!P.eyes.includes(state.eye))   state.eye  = P.eyes[0];
      if(!P.bgs.includes(state.bg))     state.bg   = P.bgs[0];
      if(!P.accs.includes(state.acc))   state.acc  = P.accs[0];
      if(!P.bangs.includes(state.bangs)) state.bangs = P.bangs[0];
      if(!P.styles.includes(state.hairStyle)) state.hairStyle = P.styles[0];
      if(!P.eyeStyles.includes(state.eyeStyle)) state.eyeStyle = P.eyeStyles[0];
      buildPanel(); render(); renderMinis();
    };
  });
  const applySeed = ()=>{
    const v = parseInt(document.getElementById('seedInput').value, 10);
    if(!isNaN(v)){ state.seed = v; applySeedAll(); }
  };
  document.getElementById('btn-apply-seed').onclick = applySeed;
  document.getElementById('seedInput').onkeydown = e=>{ if(e.key==='Enter') applySeed(); };

  syncPanel();
}

function syncPanel(){
  panelEl.querySelectorAll('[data-k]').forEach(el=>{
    let cur = state[el.dataset.k];
    el.classList.toggle('on', String(cur) === el.dataset.v);
  });
  panelEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.classList.toggle('on', !!state[el.dataset.toggle]);
  });
}

/* ---------- 随机 ---------- */
function newSeed(){
  return Math.floor(Math.random()*900000000) + 100000000;
}
function randomize(){
  const P = PACKS[state.pack];
  const rnd = ()=>Math.random();
  const pk = a => a[Math.floor(rnd()*a.length)];
  state.seed = newSeed();
  state.skin = pk(P.skins);
  state.hair = pk(P.hairs);
  state.eye  = pk(P.eyes);
  state.bg   = pk(P.bgs);
  state.acc  = pk(P.accs);
  state.hairStyle = pk(P.styles);
  state.bangs = pk(P.bangs);
  state.eyeStyle = pk(P.eyeStyles);
  state.mouth = pk(MOUTHS).id;
  state.brow = pk(BROWS).id;
  state.clothes = Math.floor(rnd()*CLOTHES.length);
  state.elfEars = state.pack === 'elf' ? (rnd() > .25) : rnd() > .78;
  state.blush = rnd() > .1;
  state.sparkle = rnd() > .25;
  applySeedAll();
}

/* 由种子确定性生成整套状态（“套用种子”用） */
function applySeedAll(){
  const v = state.seed;
  const rng = mulberry32(v);
  const P = PACKS[state.pack];
  state.skin = P.skins[Math.floor(rng()*P.skins.length)];
  state.hair = P.hairs[Math.floor(rng()*P.hairs.length)];
  state.eye  = P.eyes[Math.floor(rng()*P.eyes.length)];
  state.bg   = P.bgs[Math.floor(rng()*P.bgs.length)];
  state.acc  = P.accs[Math.floor(rng()*P.accs.length)];
  state.hairStyle = P.styles[Math.floor(rng()*P.styles.length)];
  state.bangs = P.bangs[Math.floor(rng()*P.bangs.length)];
  state.eyeStyle = wpick(rng, EYE_WEIGHTS);
  state.mouth = wpick(rng, MOUTH_WEIGHTS);
  state.brow = BROWS[Math.floor(rng()*BROWS.length)].id;
  state.clothes = Math.floor(rng()*CLOTHES.length);
  state.elfEars = state.pack === 'elf' ? rng() > .2 : rng() > .75;
  state.blush = rng() > .12;
  state.sparkle = rng() > .3;
  buildPanel(); render(); refreshMinis(); syncPanel();
}

function refreshMinis(){
  miniSeeds = Array.from({length:12}, ()=> newSeed());
  selectedMini = -1;
  renderMinis();
}

/* ---------- 导出 ---------- */
function download(name, url){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}
function exportPNG(){
  const raw = buildAvatar(state, 'export');
  const blob = new Blob([raw], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
    const size = 1024;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    c.toBlob(b=>{
      const u = URL.createObjectURL(b);
      download(`avatar-${state.pack}-${state.seed}.png`, u);
      setTimeout(()=>URL.revokeObjectURL(u), 4000);
      toast('已保存 PNG（1024×1024）');
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>toast('导出失败，试试 SVG');
  img.src = url;
}
function exportSVG(){
  const blob = new Blob([buildAvatar(state,'export')], {type:'image/svg+xml;charset=utf-8'});
  const u = URL.createObjectURL(blob);
  download(`avatar-${state.pack}-${state.seed}.svg`, u);
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
  toast('已保存 SVG 矢量文件');
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* ---------- 绑定 ---------- */
document.getElementById('btn-random').onclick = ()=>{ randomize(); toast('换了个新的'); };
document.getElementById('btn-png').onclick = exportPNG;
document.getElementById('btn-svg').onclick = exportSVG;
document.getElementById('btn-copy').onclick = ()=>{
  navigator.clipboard?.writeText(String(state.seed)).then(()=>toast('种子已复制'), ()=>toast('复制失败'));
};
document.getElementById('btn-refresh-mini').onclick = ()=>{ refreshMinis(); };

window.addEventListener('keydown', e=>{
  if(e.code === 'Space' && e.target.tagName !== 'INPUT'){
    e.preventDefault(); randomize(); toast('换了个新的');
  }
});

/* ---------- 启动 ---------- */
buildPanel();
render();
refreshMinis();
</script>
</body>
</html>
