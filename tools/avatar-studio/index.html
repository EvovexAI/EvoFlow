<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>头像工坊 · Avatar Studio</title>
<style>
  :root{
    --ink:#20222E;
    --ink-2:#545A6B;
    --muted:#8E94A6;
    --line:#E8EEF0;
    --bg:#FAFDFC;
    --card:#FFFFFF;
    --accent:#31B894;
    --accent-2:#6FB6E8;
    --accent-3:#A78BFA;
    --shadow:0 10px 34px rgba(90,150,140,.13);
    --shadow-sm:0 4px 14px rgba(90,150,140,.10);
    --r-lg:26px;
    --r-md:18px;
    --r-sm:13px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 600px at 6% -10%, #E4FBF3 0%, rgba(228,251,243,0) 60%),
      radial-gradient(900px 620px at 100% 0%, #EDF2FF 0%, rgba(237,242,255,0) 55%),
      radial-gradient(900px 700px at 50% 110%, #F6F1FF 0%, rgba(246,241,255,0) 60%),
      var(--bg);
    min-height:100%;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1240px;margin:0 auto;padding:26px 24px 60px}

  /* ---------- header ---------- */
  header.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  .logo{
    width:46px;height:46px;border-radius:15px;flex:none;
    background:linear-gradient(140deg,#5FD9BE,#7FC6F0 55%,#B49BFB);
    box-shadow:0 8px 22px rgba(95,217,190,.35);
    display:grid;place-items:center;
  }
  .logo svg{width:26px;height:26px}
  .titles h1{font-size:20px;margin:0;letter-spacing:.2px;font-weight:700}
  .titles p{margin:3px 0 0;font-size:12.5px;color:var(--muted);letter-spacing:.3px}
  .top-spacer{flex:1}
  .badge{
    font-size:12px;color:#2E9276;background:#EDFBF6;border:1px solid #D3F2E8;
    padding:7px 13px;border-radius:999px;font-weight:600;letter-spacing:.2px;
  }

  /* ---------- layout ---------- */
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 402px;gap:22px;align-items:start}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}

  /* ---------- stage ---------- */
  .stage{position:sticky;top:24px}
  .canvas{
    position:relative;border-radius:var(--r-lg);padding:18px;
    background:linear-gradient(160deg,#FFFFFF,#F9FCFB 60%,#F6F8FF);
    box-shadow:var(--shadow);border:1px solid #EAF2F1;
    display:grid;place-items:center;overflow:hidden;
  }
  .canvas::after{
    content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:radial-gradient(420px 260px at 50% 0%,rgba(255,255,255,.75),transparent 70%);
  }
  #stage{width:100%;max-width:600px;display:block;border-radius:20px;overflow:hidden;
    box-shadow:0 14px 40px rgba(120,90,120,.13);}
  #stage svg{display:block;width:100%;height:auto}

  .stage-bar{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
  .btn{
    appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);
    font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.2px;
    padding:11px 16px;border-radius:13px;cursor:pointer;transition:.16s ease;
    display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow-sm)
  }
  .btn:hover{transform:translateY(-1px);border-color:#CFE9E2;box-shadow:0 8px 20px rgba(90,150,140,.16)}
  .btn:active{transform:translateY(0) scale(.985)}
  .btn.primary{
    border:none;color:#fff;
    background:linear-gradient(135deg,#2FB894,#41C6B8 50%,#6BB6E8);
    box-shadow:0 10px 24px rgba(47,184,148,.30);flex:1;justify-content:center;
  }
  .btn.primary:hover{box-shadow:0 14px 32px rgba(47,184,148,.40)}
  .btn svg{width:16px;height:16px;flex:none;opacity:.9}
  .btn.primary svg{opacity:1}

  .seedbar{
    margin-top:12px;display:flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--muted);flex-wrap:wrap
  }
  .seedbar code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
    color:#5F6B7D;background:#F3F8F7;border:1px solid #E4EFEC;
    padding:5px 10px;border-radius:9px;letter-spacing:.4px
  }
  .link{color:#2E9276;cursor:pointer;text-decoration:none;font-weight:600;border-bottom:1px dashed #BFE5D9;padding-bottom:1px}
  .link:hover{color:#1F6E58}

  /* ---------- panel ---------- */
  .panel{
    background:var(--card);border-radius:var(--r-lg);border:1px solid #EAF2F1;
    box-shadow:var(--shadow);padding:6px 18px 20px;
    scrollbar-width:thin;scrollbar-color:#D8EAE6 transparent;
  }
  .panel::-webkit-scrollbar{width:9px}
  .panel::-webkit-scrollbar-thumb{background:#DCEDE9;border-radius:9px;border:2px solid #fff}
  .panel::-webkit-scrollbar-track{background:transparent}

  .sect{padding:12px 0;border-bottom:1px dashed #EDF4F2}
  .sect:last-of-type{border-bottom:none}
  .sect+.sect{margin-top:16px}
  .sect-head{display:flex;align-items:center;gap:9px;margin:0 0 13px}
  .sect-head h3{
    font-size:11.5px;font-weight:800;letter-spacing:1.8px;color:#1E8A6E;
    margin:0;background:#E7F6F1;padding:5px 10px;border-radius:8px;
    line-height:1.2;white-space:nowrap
  }
  .sect-head .rule{flex:1;height:1px;background:linear-gradient(90deg,#D6EAE4,transparent)}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#F2F8F7;padding:5px;border-radius:15px}
  .seg button{
    appearance:none;border:none;background:transparent;font-family:inherit;cursor:pointer;
    padding:10px 6px;border-radius:11px;font-size:13px;font-weight:600;color:#8E9AA8;
    transition:.18s ease;display:flex;align-items:center;justify-content:center;gap:6px
  }
  .seg button.on{background:#fff;color:#1F7A63;box-shadow:0 3px 10px rgba(80,160,140,.18)}
  .seg button span.ic{font-size:14px}

  .row{display:flex;align-items:flex-start;gap:12px;margin-bottom:13px}
  .row:last-child{margin-bottom:0}
  .row > .lb{width:44px;flex:none;font-size:12.5px;color:#8E9AA8;padding-top:7px;letter-spacing:.3px}
  .row > .ct{flex:1;display:flex;flex-wrap:wrap;gap:7px}

  .sw{
    width:27px;height:27px;border-radius:50%;cursor:pointer;border:none;padding:0;position:relative;
    box-shadow:0 2px 6px rgba(120,90,110,.16);transition:.16s ease;
  }
  .sw:hover{transform:translateY(-2px) scale(1.06)}
  .sw.on::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    border:2px solid #31B894;box-shadow:0 0 0 3px #EAFBF6
  }

  .chip{
    appearance:none;font-family:inherit;cursor:pointer;font-size:12.5px;font-weight:600;
    padding:7px 12px;border-radius:11px;border:1px solid var(--line);background:#fff;color:#6F7A87;
    transition:.16s ease;letter-spacing:.2px
  }
  .chip:hover{border-color:#CBE9E0;color:#2E9276;background:#F7FDFB}
  .chip.on{background:linear-gradient(140deg,#EAFBF5,#F0F8FF);border-color:#A9E3D3;color:#1F7A63;
    box-shadow:0 3px 10px rgba(80,190,160,.18)}

  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .toggle{
    display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:600;
    color:#7C8797;padding:7px 12px 7px 9px;border-radius:12px;border:1px solid var(--line);
    background:#fff;transition:.16s ease;user-select:none
  }
  .toggle .dot{
    width:30px;height:17px;border-radius:99px;background:#E7EDEC;position:relative;transition:.2s ease;flex:none
  }
  .toggle .dot::after{
    content:"";position:absolute;top:2.5px;left:2.5px;width:12px;height:12px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.18);transition:.2s cubic-bezier(.3,1.4,.5,1)
  }
  .toggle.on{color:#1F7A63;border-color:#A9E3D3;background:#F7FEFB}
  .toggle.on .dot{background:linear-gradient(135deg,#2FB894,#6BB6E8)}
  .toggle.on .dot::after{left:15px}

  /* ---------- gallery ---------- */
  .gallery{margin-top:26px}
  .g-head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .g-head h2{font-size:15.5px;margin:0;font-weight:700;letter-spacing:.3px}
  .g-head p{margin:0;font-size:12.5px;color:var(--muted)}
  .g-head .spacer{flex:1}
  .grid{
    display:grid;grid-template-columns:repeat(6,1fr);gap:13px
  }
  @media(max-width:1000px){.grid{grid-template-columns:repeat(4,1fr)}}
  @media(max-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
  .mini{
    appearance:none;border:none;padding:0;cursor:pointer;position:relative;
    border-radius:18px;overflow:hidden;background:#fff;
    box-shadow:0 6px 18px rgba(90,150,140,.14);transition:.2s cubic-bezier(.3,1.2,.5,1);
    aspect-ratio:1/1
  }
  .mini svg{display:block;width:100%;height:100%}
  .mini:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 14px 30px rgba(90,150,140,.24)}
  .mini::after{
    content:"";position:absolute;inset:0;border-radius:inherit;
    border:2px solid transparent;transition:.2s
  }
  .mini.on::after{border-color:#31B894;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}

  .foot{margin-top:34px;text-align:center;font-size:12px;color:#BDAFBB;letter-spacing:.4px}
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:#2C2431;color:#fff;font-size:13px;padding:11px 20px;border-radius:13px;
    box-shadow:0 12px 30px rgba(0,0,0,.24);opacity:0;pointer-events:none;transition:.26s ease;z-index:99
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none">
        <path d="M12 3.2 14.3 9l6.2.4-4.8 4 1.6 6-5.3-3.3L6.7 19.4l1.6-6-4.8-4L9.7 9 12 3.2Z" fill="#fff" opacity=".95"/>
      </svg>
    </div>
    <div class="titles">
      <h1>头像工坊 · Avatar Studio</h1>
      <p>月夜 / 森林 / 花间 · 程序化生成的矢量精灵头像</p>
    </div>
    <div class="top-spacer"></div>
    <div class="badge">纯 SVG · 无限放大不糊</div>
  </header>

  <div class="layout">
    <section class="stage">
      <div class="canvas">
        <div id="stage"></div>
      </div>
      <div class="stage-bar">
        <button class="btn primary" id="btn-random">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          随机一个
        </button>
        <button class="btn" id="btn-png">PNG 1024</button>
        <button class="btn" id="btn-svg">SVG</button>
      </div>
      <div class="seedbar">
        <span>种子</span><code id="seed-txt">—</code>
        <a class="link" id="btn-copy">复制</a>
        <span style="color:#D9CBD4">·</span>
        <span>空格键可快速随机</span>
      </div>
    </section>

    <aside class="panel" id="panel"></aside>
  </div>

  <section class="gallery">
    <div class="g-head">
      <h2>灵感速览</h2>
      <p>点一张直接替换，或继续微调</p>
      <div class="spacer"></div>
      <button class="btn" id="btn-refresh-mini" style="padding:8px 14px;font-size:12.5px">再抽一组</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="foot">程序化绘制 · 无外部素材 · 所有元素可无限重绘</div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================================
   1. 色板与部件数据
   ========================================================================= */
const SKINS = [
  {id:'moon',  c:'#F6EFF6', s:'#DFD2E6', b:'#C79FE0'},
  {id:'cream', c:'#FFF2E9', s:'#F4D6C6', b:'#FFA3B4'},
  {id:'peach', c:'#FFDFCB', s:'#F2BC9E', b:'#FF9AA6'},
  {id:'honey', c:'#F8D5B0', s:'#E0AE83', b:'#F0908A'},
  {id:'moss',  c:'#EAF1DA', s:'#C8D8AF', b:'#A6CE86'},
  {id:'lilac', c:'#EDE2F7', s:'#D0BDE9', b:'#B58FE6'},
  {id:'rose',  c:'#FFE8ED', s:'#F7C8D2', b:'#FF8FA8'},
  {id:'cocoa', c:'#DEAF84', s:'#BE885E', b:'#D2766A'}

const HAIRS = [
  {id:'silver', name:'月光银', c:'#D2D9EC', d:'#A3AEC9', l:'#F4F7FF'},
  {id:'violet', name:'薰衣草', c:'#B49AE4', d:'#8C71C0', l:'#DCC7FA'},
  {id:'mint',   name:'薄荷',   c:'#95CEBB', d:'#6DA593', l:'#C6EDDE'},
  {id:'ink',    name:'墨夜',   c:'#443C54', d:'#2C2639', l:'#615874'},
  {id:'honey',  name:'蜜金',   c:'#EDBC6E', d:'#C99848', l:'#FBD99D'},
  {id:'sakura', name:'樱粉',   c:'#F2A9C3', d:'#D683A2', l:'#FFCBDF'},
  {id:'sky',    name:'雾蓝',   c:'#8EB1DF', d:'#6688BB', l:'#B7CFF3'},
  {id:'forest', name:'苔绿',   c:'#6C9876', d:'#4C725C', l:'#92BC9C'},
  {id:'ember',  name:'暮橘',   c:'#F09263', d:'#CB7046', l:'#FFBB95'}
];
const EYES = [
  {id:'teal',   name:'青碧', c:'#2E8B7C'},
  {id:'amber',  name:'琥珀', c:'#96602C'},
  {id:'indigo', name:'靛蓝', c:'#4E57C0'},

  {id:'olive',  name:'橄榄', c:'#6C8B33'},
  {id:'copper', name:'赤铜', c:'#B25C22'}
];
const BGS = [
  {id:'moon',   c1:'#20304F', c2:'#4A6E9E', ac:'#9CCBFF', deco:'stars'},
  {id:'forest', c1:'#123A31', c2:'#2F6B59', ac:'#7FE0B8', deco:'fireflies'},
  {id:'bloom',  c1:'#43264E', c2:'#82467C', ac:'#F0A9DC', deco:'petals'},
  {id:'void',   c1:'#241C42', c2:'#52407F', ac:'#C0A6FF', deco:'ring'},
  {id:'frost',  c1:'#1B3646', c2:'#44708C', ac:'#A8D8F0', deco:'bokeh'},
  {id:'sakura', c1:'#FFF4F9', c2:'#FFD2E3', ac:'#FF9DBB', deco:'soft'},
  {id:'mintl',  c1:'#EFFDF8', c2:'#C4EEE1', ac:'#77CFB7', deco:'bokeh'},
  {id:'dawn',   c1:'#FFF2DC', c2:'#F2C199', ac:'#FFB06B', deco:'ring'},
  {id:'sky',    c1:'#F1F9FF', c2:'#C7DEFF', ac:'#8FBBF0', deco:'soft'}
];
const CLOTHES = ['#F2FBF7','#FDF3F7','#EFF4FF','#F7F0FF','#FFF6EA','#E9F6F4','#3E4A6B','#6E4E7A'];

const HAIR_STYLES = [
  {id:'long', name:'长直发'},
  {id:'bob',  name:'短发'},
  {id:'twin', name:'双马尾'}
];
const BANGS = [
  {id:'full', name:'齐刘海'},
  {id:'part', name:'中分'},
  {id:'side', name:'侧分'},
  {id:'none', name:'露额头'}
];
const EYE_STYLES = [
  {id:'big',     name:'清亮'},
  {id:'sparkle', name:'星芒'}
];
const MOUTHS = [
  {id:'smile', name:'微笑'},
  {id:'open',  name:'大笑'},
  {id:'cat',   name:'猫嘴'},
  {id:'small', name:'小圆嘴'},
  {id:'tongue',name:'吐舌'}
];
const BROWS = [
  {id:'soft',   name:'柔和'},
  {id:'straight',name:'平眉'},
  {id:'up',     name:'弯眉'}
];
const ACCS = [
  {id:'none',      name:'无'},
  {id:'leafCrown', name:'叶冠'},
  {id:'flower',    name:'小花'},
  {id:'crescent',  name:'月牙'},
  {id:'gem',       name:'额饰'},
  {id:'horns',     name:'小角'},
  {id:'starClip',  name:'星夹'}
];

const PACKS = {
  moon:{
    label:'月夜精灵', icon:'🌙',
    skins:['peach','moon','lilac','cream','rose'],
    hairs:['ink','silver','violet','sky'],
    eyes:['teal','orchid','indigo','ocean'],
    bgs:['void','moon','frost','bloom'],
    accs:['leafCrown','crescent','gem','starClip','none'],
    styles:['long','bob','twin'],
    bangs:['full','part','side','none'],
    eyeStyles:['big','sparkle']
  },
  forest:{
    label:'森林精灵', icon:'🌿',
    skins:['moss','cream','peach','honey','rose'],
    hairs:['forest','mint','honey','ink','ember'],
    eyes:['olive','amber','teal','copper'],
    bgs:['forest','dawn','mintl','sky'],
    accs:['leafCrown','flower','gem','none'],
    styles:['long','twin','bob'],
    bangs:['full','side','part','none'],
    eyeStyles:['big','sparkle']
  },
  bloom:{
    label:'花间精灵', icon:'🌸',
    skins:['peach','rose','cream','honey'],
    hairs:['sakura','honey','ember','violet','silver'],
    eyes:['rose','amber','orchid','teal'],
    bgs:['sakura','bloom','dawn','mintl'],
    accs:['flower','leafCrown','starClip','gem','none'],
    styles:['twin','long','bob'],
    bangs:['full','side','part'],
    eyeStyles:['big','sparkle']
  }
};

/* =========================================================================
   2. 工具
   ========================================================================= */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function shade(hex, amt){
  const [r,g,b] = hexToRgb(hex);
  const f = v => Math.max(0,Math.min(255, Math.round(amt>0 ? v+(255-v)*amt : v*(1+amt))));
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rgba(c, a){
  if(String(c).startsWith('rgb')){
    const m = String(c).match(/[\d.]+/g);
    return `rgba(${m[0]},${m[1]},${m[2]},${a})`;
  }
  const [r,g,b] = hexToRgb(c);
  return `rgba(${r},${g},${b},${a})`;
}
function byId(list,id){ return list.find(x=>x.id===id) || list[0]; }
function wpick(rng, pairs){
  const total = pairs.reduce((a,b)=>a+b[1],0);
  let r = rng()*total;
  for(const [v,w] of pairs){ r -= w; if(r <= 0) return v; }
  return pairs[pairs.length-1][0];
}
const FACE_INK = '#3A2E40';
function star4(x,y,r,color,op){
  x = +x; y = +y; r = +r;
  const k = r*0.24;
  return `<path d="M${x},${y-r} Q${x+k},${y-k} ${x+r},${y} Q${x+k},${y+k} ${x},${y+r} Q${x-k},${y+k} ${x-r},${y} Q${x-k},${y-k} ${x},${y-r} Z" fill="${color}" opacity="${op}"/>`;
}

/* =========================================================================
   3. 状态
   ========================================================================= */
const EYE_WEIGHTS = [['big',.40],['sparkle',.28],['gentle',.14],['wink',.11],['sleepy',.07]];
const MOUTH_WEIGHTS = [['smile',.32],['cat',.24],['small',.20],['open',.15],['tongue',.09]];

const DEFAULT = {
  pack:'moon', skin:'peach', hair:'ink', eye:'teal', bg:'void',
  hairStyle:'long', bangs:'full', eyeStyle:'sparkle', mouth:'smile', brow:'soft',
  acc:'leafCrown', clothes:5, blush:true, sparkle:true,
  seed: 20261104
};
let state = {...DEFAULT};
let miniSeeds = [];
let selectedMini = -1;

/* =========================================================================
   4. 绘制 —— 精灵（半写实矢量）
   ========================================================================= */
function buildSprite(st, uid){
  uid = uid || 'a';
  const S = byId(SKINS, st.skin);
  const H = byId(HAIRS, st.hair);
  const E = byId(EYES, st.eye);
  const B = byId(BGS, st.bg);
  const rng = mulberry32((st.seed||1)*7919 + 17);
  const r = (a,b)=> a + rng()*(b-a);

/* =========================================================================
   5. 渲染与交互
   ========================================================================= */
const stageEl = document.getElementById('stage');
const panelEl = document.getElementById('panel');
const gridEl  = document.getElementById('grid');
const seedTxt = document.getElementById('seed-txt');

function render(){
  stageEl.innerHTML = buildSprite(state, 'stage');
  seedTxt.textContent = String(state.seed);
  syncPanel();
}

function renderMinis(){
  gridEl.innerHTML = miniSeeds.map((seed,i)=>{
    const s = {...state, seed};
    const rng = mulberry32(seed);
    // 让每张也有变化：随机部件
    const pack = state.pack;
    const P = PACKS[pack];
    s.skin = P.skins[Math.floor(rng()*P.skins.length)];
    s.hair = P.hairs[Math.floor(rng()*P.hairs.length)];
    s.eye  = P.eyes[Math.floor(rng()*P.eyes.length)];
    s.bg   = P.bgs[Math.floor(rng()*P.bgs.length)];
    s.clothes = Math.floor(rng()*CLOTHES.length);
    s.acc  = P.accs[Math.floor(rng()*P.accs.length)];
    s.hairStyle = P.styles[Math.floor(rng()*P.styles.length)];
    s.bangs = P.bangs[Math.floor(rng()*P.bangs.length)];
    s.eyeStyle = wpick(rng, EYE_WEIGHTS);
    s.mouth = wpick(rng, MOUTH_WEIGHTS);
    s.brow = BROWS[Math.floor(rng()*BROWS.length)].id;
    s.blush = rng() > .12;
    s.sparkle = rng() > .3;
    return `<button class="mini${selectedMini===i?' on':''}" data-i="${i}" title="采用这个">
              ${buildSprite(s, 'm'+i)}
            </button>`;
  }).join('');
  gridEl.querySelectorAll('.mini').forEach(el=>{
    el.onclick = ()=>{
      const i = +el.dataset.i;
      const seed = miniSeeds[i];
      const rng = mulberry32(seed);
      const P = PACKS[state.pack];
      state = {
        ...state, seed,
        skin: P.skins[Math.floor(rng()*P.skins.length)],
        hair: P.hairs[Math.floor(rng()*P.hairs.length)],
        eye:  P.eyes[Math.floor(rng()*P.eyes.length)],
        bg:   P.bgs[Math.floor(rng()*P.bgs.length)],
        clothes: Math.floor(rng()*CLOTHES.length),
        acc:  P.accs[Math.floor(rng()*P.accs.length)],
        hairStyle: P.styles[Math.floor(rng()*P.styles.length)],
        bangs: P.bangs[Math.floor(rng()*P.bangs.length)],
        eyeStyle: wpick(rng, EYE_WEIGHTS),
        mouth: wpick(rng, MOUTH_WEIGHTS),
        brow: BROWS[Math.floor(rng()*BROWS.length)].id,
      };
      selectedMini = i;
      render(); renderMinis();
      toast('已采用第 ' + (i+1) + ' 个');
    };
  });
}

/* ---------- 控制面板 ---------- */
function buildPanel(){
  const P = PACKS[state.pack];
  const skins = SKINS.filter(s=>P.skins.includes(s.id));
  const hairs = HAIRS.filter(s=>P.hairs.includes(s.id));
  const eyes  = EYES.filter(s=>P.eyes.includes(s.id));
  const bgs   = BGS.filter(s=>P.bgs.includes(s.id));

  const swatches = (list, key, colorFn, title) =>
    `<div class="row"><div class="lb">${title}</div><div class="ct">
      ${list.map(x=>`<button class="sw" data-k="${key}" data-v="${x.id}"
        style="background:${colorFn(x)}" title="${x.name}"></button>`).join('')}
    </div></div>`;

  const chips = (list, key, title) =>
    `<div class="row"><div class="lb">${title}</div><div class="ct">
      ${list.map(x=>`<button class="chip" data-k="${key}" data-v="${x.id}">${x.name}</button>`).join('')}
    </div></div>`;

  panelEl.innerHTML = `
    <div class="sect" style="padding-top:18px">
      <div class="seg" id="packSeg">
        <button data-pack="moon"   class="${state.pack==='moon'?'on':''}"><span class="ic">🌙</span>月夜</button>
        <button data-pack="forest" class="${state.pack==='forest'?'on':''}"><span class="ic">🌿</span>森林</button>
        <button data-pack="bloom"  class="${state.pack==='bloom'?'on':''}"><span class="ic">🌸</span>花间</button>
      </div>
    </div>

    <div class="sect">
      <div class="sect-head"><h3>五官</h3><div class="rule"></div></div>
      ${swatches(skins,'skin',x=>`linear-gradient(145deg,${x.c},${x.s})`,'肤色')}
      ${chips(EYE_STYLES,'eyeStyle','眼型')}
      ${swatches(eyes,'eye',x=>x.c,'瞳色')}
      ${chips(BROWS,'brow','眉形')}
      ${chips(MOUTHS,'mouth','嘴型')}
    </div>

    <div class="sect">
      <div class="sect-head"><h3>头发</h3><div class="rule"></div></div>
      ${chips(HAIR_STYLES,'hairStyle','发型')}
      ${chips(BANGS,'bangs','刘海')}
      ${swatches(hairs,'hair',x=>`linear-gradient(145deg,${x.l},${x.d})`,'发色')}
    </div>

    <div class="sect">
      <div class="sect-head"><h3>装饰</h3><div class="rule"></div></div>
      ${chips(ACCS.filter(a=>P.accs.includes(a.id)),'acc','配饰')}
      ${swatches(bgs,'bg',x=>`linear-gradient(145deg,${x.c1},${x.c2})`,'背景')}
      <div class="row"><div class="lb">细节</div><div class="ct">
        <div class="toggle" data-toggle="blush"><span class="dot"></span>腮红</div>
        <div class="toggle" data-toggle="sparkle"><span class="dot"></span>光点</div>
      </div></div>
      <div class="row"><div class="lb">衣服</div><div class="ct">
        ${CLOTHES.map((c,i)=>`<button class="sw" data-k="clothes" data-v="${i}" style="background:${c};box-shadow:inset 0 0 0 1.5px #EFE6EE" title="第${i+1}套"></button>`).join('')}
      </div></div>
    </div>

    <div class="sect">
      <div class="sect-head"><h3>种子</h3><div class="rule"></div></div>
      <div class="row"><div class="lb">复现</div><div class="ct" style="align-items:center;gap:8px">
        <input id="seedInput" value="${state.seed}" style="flex:1;min-width:120px;font-family:ui-monospace,monospace;
          font-size:13px;padding:9px 12px;border-radius:11px;border:1px solid #F0E7EE;background:#FFFBFD;color:#5B4F63;outline:none"/>
        <button class="chip" id="btn-apply-seed">套用</button>
      </div></div>
    </div>
  `;

  // 交互
  panelEl.querySelectorAll('[data-k]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.k;
      let v = el.dataset.v;
      if(k === 'clothes') v = +v;
      state[k] = v;
      render();
    };
  });
  panelEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.toggle;
      state[k] = !state[k];
      render();
    };
  });
  panelEl.querySelectorAll('[data-pack]').forEach(el=>{
    el.onclick = ()=>{
      if(state.pack === el.dataset.pack) return;
      state.pack = el.dataset.pack;
      const P = PACKS[state.pack];
      if(!P.skins.includes(state.skin)) state.skin = P.skins[0];
      if(!P.hairs.includes(state.hair)) state.hair = P.hairs[0];
      if(!P.eyes.includes(state.eye))   state.eye  = P.eyes[0];
      if(!P.bgs.includes(state.bg))     state.bg   = P.bgs[0];
      if(!P.accs.includes(state.acc))   state.acc  = P.accs[0];
      if(!P.bangs.includes(state.bangs)) state.bangs = P.bangs[0];
      if(!P.styles.includes(state.hairStyle)) state.hairStyle = P.styles[0];
      if(!P.eyeStyles.includes(state.eyeStyle)) state.eyeStyle = P.eyeStyles[0];
      buildPanel(); render(); renderMinis();
    };
  });
  const applySeed = ()=>{
    const v = parseInt(document.getElementById('seedInput').value, 10);
    if(!isNaN(v)){ state.seed = v; applySeedAll(); }
  };
  document.getElementById('btn-apply-seed').onclick = applySeed;
  document.getElementById('seedInput').onkeydown = e=>{ if(e.key==='Enter') applySeed(); };

  syncPanel();
}

function syncPanel(){
  panelEl.querySelectorAll('[data-k]').forEach(el=>{
    let cur = state[el.dataset.k];
    el.classList.toggle('on', String(cur) === el.dataset.v);
  });
  panelEl.querySelectorAll('[data-toggle]').forEach(el=>{
    el.classList.toggle('on', !!state[el.dataset.toggle]);
  });
}

/* ---------- 随机 ---------- */
function newSeed(){
  return Math.floor(Math.random()*900000000) + 100000000;
}
function randomize(){
  const P = PACKS[state.pack];
  const rnd = ()=>Math.random();
  const pk = a => a[Math.floor(rnd()*a.length)];
  state.seed = newSeed();
  state.skin = pk(P.skins);
  state.hair = pk(P.hairs);
  state.eye  = pk(P.eyes);
  state.bg   = pk(P.bgs);
  state.acc  = pk(P.accs);
  state.hairStyle = pk(P.styles);
  state.bangs = pk(P.bangs);
  state.eyeStyle = pk(P.eyeStyles);
  state.mouth = pk(MOUTHS).id;
  state.brow = pk(BROWS).id;
  state.clothes = Math.floor(rnd()*CLOTHES.length);
  state.blush = rnd() > .1;
  state.sparkle = rnd() > .25;
  applySeedAll();
}

/* 由种子确定性生成整套状态（“套用种子”用） */
function applySeedAll(){
  const v = state.seed;
  const rng = mulberry32(v);
  const P = PACKS[state.pack];
  state.skin = P.skins[Math.floor(rng()*P.skins.length)];
  state.hair = P.hairs[Math.floor(rng()*P.hairs.length)];
  state.eye  = P.eyes[Math.floor(rng()*P.eyes.length)];
  state.bg   = P.bgs[Math.floor(rng()*P.bgs.length)];
  state.acc  = P.accs[Math.floor(rng()*P.accs.length)];
  state.hairStyle = P.styles[Math.floor(rng()*P.styles.length)];
  state.bangs = P.bangs[Math.floor(rng()*P.bangs.length)];
  state.eyeStyle = wpick(rng, EYE_WEIGHTS);
  state.mouth = wpick(rng, MOUTH_WEIGHTS);
  state.brow = BROWS[Math.floor(rng()*BROWS.length)].id;
  state.clothes = Math.floor(rng()*CLOTHES.length);
  state.blush = rng() > .12;
  state.sparkle = rng() > .3;
  buildPanel(); render(); refreshMinis(); syncPanel();
}

function refreshMinis(){
  miniSeeds = Array.from({length:12}, ()=> newSeed());
  selectedMini = -1;
  renderMinis();
}

/* ---------- 导出 ---------- */
function download(name, url){
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
}
function exportPNG(){
  const raw = buildSprite(state, 'export');
  const blob = new Blob([raw], {type:'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.onload = ()=>{
    const size = 1024;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
    c.toBlob(b=>{
      const u = URL.createObjectURL(b);
      download(`avatar-${state.pack}-${state.seed}.png`, u);
      setTimeout(()=>URL.revokeObjectURL(u), 4000);
      toast('已保存 PNG（1024×1024）');
    }, 'image/png');
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=>toast('导出失败，试试 SVG');
  img.src = url;
}
function exportSVG(){
  const blob = new Blob([buildSprite(state,'export')], {type:'image/svg+xml;charset=utf-8'});
  const u = URL.createObjectURL(blob);
  download(`avatar-${state.pack}-${state.seed}.svg`, u);
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
  toast('已保存 SVG 矢量文件');
}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1700);
}

/* ---------- 绑定 ---------- */
document.getElementById('btn-random').onclick = ()=>{ randomize(); toast('换了个新的'); };
document.getElementById('btn-png').onclick = exportPNG;
document.getElementById('btn-svg').onclick = exportSVG;
document.getElementById('btn-copy').onclick = ()=>{
  navigator.clipboard?.writeText(String(state.seed)).then(()=>toast('种子已复制'), ()=>toast('复制失败'));
};
document.getElementById('btn-refresh-mini').onclick = ()=>{ refreshMinis(); };

window.addEventListener('keydown', e=>{
  if(e.code === 'Space' && e.target.tagName !== 'INPUT'){
    e.preventDefault(); randomize(); toast('换了个新的');
  }
});

/* ---------- 启动 ---------- */
buildPanel();
render();
refreshMinis();
</script>
</body>
</html>
