<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EvoFlow</title>
  <link rel="icon" href="/icons/assistant.svg" type="image/svg+xml">
  <!-- 修复依据：Google Fonts 外链会让 WebView 首帧等待 DNS/请求（弱网、离线时更久甚至超时），
       与「首帧零外部依赖」的启动目标冲突；改用系统字体栈，骨架屏与应用内字体随之回退。 -->
  <!-- 首帧即生效：不依赖 JS 与 variables.css。背景说明：WebView 原生底为启动页深色
       (#05040f，见 tauri.conf.json)，本文件浅色底只在启动页移除后作为主界面背景露出。 -->
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f5fb; }
    #boot-splash {
      position: fixed;
      inset: 0;
      z-index: 99990;
      overflow: hidden;
      background: #05040f;
      transition: opacity 0.38s ease, visibility 0.38s ease;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #boot-splash.boot-splash--hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* 「平台实况」小徽标（console 顶栏复用） */
    .boot-guide__live {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(90deg, #5b5fef, #7c3aed);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }
    .boot-guide__live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #bbf7d0;
      box-shadow: 0 0 0 0 rgba(187, 247, 208, 0.7);
      animation: boot-live-pulse 1.4s ease-out infinite;
    }

    /* 「正在启动」细进度线（console 顶栏底部） */
    .boot-progress {
      position: relative;
      height: 2px;
      overflow: hidden;
      background: rgba(99, 102, 241, 0.16);
    }
    .boot-progress > span {
      display: block;
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #a78bfa, #6366f1);
      background-size: 200% 100%;
      animation: boot-sp-slide 1.35s ease-in-out infinite, boot-bar-shine 1.8s linear infinite;
    }

    @keyframes boot-sp-slide {
      0% { transform: translateX(-110%); }
      50% { transform: translateX(180%); }
      100% { transform: translateX(-110%); }
    }
    @keyframes boot-bar-shine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    @keyframes boot-brand-shine {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    @keyframes boot-live-pulse {
      0% { box-shadow: 0 0 0 0 rgba(187, 247, 208, 0.75); }
      70% { box-shadow: 0 0 0 8px rgba(187, 247, 208, 0); }
      100% { box-shadow: 0 0 0 0 rgba(187, 247, 208, 0); }
    }
    /* 平台实况面板：全屏铺满开场层（canvas 由 console/boot.js 注入） */
    .boot-console {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: #05040f;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .boot-console__head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 18px 10px;
      background: linear-gradient(180deg, rgba(12, 16, 36, 0.95), rgba(12, 16, 36, 0.45));
      flex: 0 0 auto;
    }
    /* 顶栏左上角品牌：logo + 名称 */
    .boot-console__brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .boot-console__logo {
      width: 30px;
      height: 30px;
      object-fit: contain;
      filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.55));
    }
    .boot-console__name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(120deg, #a5b4fc 0%, #c4b5fd 45%, #7dd3fc 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: boot-brand-shine 3.2s ease-in-out infinite;
    }
    .boot-console__hint {
      color: rgba(150, 180, 220, 0.6);
      font-size: 11.5px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .boot-console__stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
    }
    .boot-console__stage canvas {
      position: absolute;
      inset: 0;
      display: block;
    }
    /* 嵌入 HUD：模块标签 + 字幕条 */
    #bc-host .bc-tabs {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 52px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      pointer-events: none;
    }
    #bc-host .bc-tabs .tab {
      pointer-events: auto;
    }
    #bc-host .bc-caption {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      padding: 7px 12px;
      background: rgba(6, 10, 24, 0.82);
      border: 1px solid rgba(0, 234, 255, 0.28);
      border-radius: 6px;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      min-height: 34px;
    }
    #bc-host .bc-prompt {
      color: #00eaff;
      font-weight: 700;
      flex: 0 0 auto;
    }
    #bc-host .bc-text {
      color: rgba(225, 242, 255, 0.95);
      font-size: 12.5px;
      line-height: 1.4;
    }
    #bc-host .bc-text.typing::after {
      content: '▌';
      color: #00eaff;
    }
    #bc-host .tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: rgba(10, 14, 30, 0.78);
      border: 1px solid rgba(110, 150, 200, 0.22);
      border-radius: 4px;
      color: rgba(190, 215, 240, 0.85);
      font: 500 11px/1.2 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: border-color 0.18s ease, color 0.18s ease, background 0.18s ease;
    }
    #bc-host .tab i {
      width: 6px;
      height: 6px;
      border-radius: 2px;
      display: inline-block;
      flex: 0 0 auto;
    }
    #bc-host .tab:hover {
      border-color: rgba(140, 200, 255, 0.55);
      color: #eaf6ff;
    }
    #bc-host .tab.on {
      background: rgba(0, 60, 80, 0.5);
      border-color: rgba(0, 234, 255, 0.75);
      color: #e6fbff;
      box-shadow: 0 0 12px rgba(0, 234, 255, 0.25);
    }
    #bc-host .tab-overview {
      margin-left: auto;
    }

    @media (max-width: 860px) {
      .boot-console__hint { display: none; }
      .boot-console__name { font-size: 16px; }
    }
    /* 开场介绍页动效始终播放，不跟随系统「减少动态效果」——
       否则部分电脑启动页光斑/进度条静止，体验不一致。 */
  </style>
  <!-- entry: main.js via Vite -->
</head>
<body>

  <!-- 独立于 #content：路由 innerHTML 清空时不会把开场层删掉 -->
  <div id="boot-splash" aria-hidden="true">

  <!-- 平台实况：全屏 2D 中枢指挥台，自动巡游讲解六个模块与 AI 的协作（console/boot.js 注入）；左上角保留品牌 logo -->
  <aside class="boot-console" aria-label="平台实况演示">
    <div class="boot-console__head">
      <div class="boot-console__brand">
        <img class="boot-console__logo" src="/images/logo.png" alt="" width="30" height="30" />
        <span class="boot-console__name">EvoFlow</span>
        <span class="boot-guide__live"><span class="boot-guide__live-dot" aria-hidden="true"></span>平台实况</span>
      </div>
      <span class="boot-console__hint">自动巡游讲解 · 点击模块查看详情 · 对 AI 说「帮我记一条待办」即可开始</span>
    </div>
    <div class="boot-console__stage" id="bc-host"></div>
    <div class="boot-progress" aria-hidden="true"><span></span></div>
  </aside>
  </div>

  <div id="app">
    <aside id="app-shell-aside" aria-label="主导航"></aside>
    <div id="main-col">
      <div id="update-banner" class="update-banner update-banner-hidden"></div>
      <div id="gw-banner" class="gw-banner gw-banner-hidden"></div>
      <!-- 独立于 #content：路由切换时隐藏而不卸载 ChatApp，保持 SSE 与对话状态 -->
      <div id="chat-persistent-host" hidden></div>
      <main id="content"></main>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
  <!-- 平台实况控制台（defer 不阻塞首帧；load 后才启动画布） -->
  <script defer src="/console/utils.js"></script>
  <script defer src="/console/engine.js"></script>
  <script defer src="/console/scene.js"></script>
  <script defer src="/console/ui.js"></script>
  <script defer src="/console/boot.js"></script>
</body>
</html>
