# =============================================================================
# EvoPanel Docker Compose 配置
# =============================================================================
# 使用方法:
#   1. 快速启�? docker compose up -d
#   2. 查看日志: docker compose logs -f
#   3. 停止服务: docker compose down
#   4. 重新构建: docker compose up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # EvoPanel Web 服务
  # ---------------------------------------------------------------------------
  evopanel:
    build:
      context: .
      dockerfile: Dockerfile
      # 使用 BuildKit 构建缓存
      cache_from:
        - evopanel:build-cache
      args:
        - NPM_REGISTRY=https://registry.npmmirror.com
    container_name: evopanel
    hostname: evopanel

    # -------------------------------------------------------------------------
    # 网络配置 - 关键：使�?host 网络模式解决容器内外互通问�?    # -------------------------------------------------------------------------
    # host 模式：容器共享宿主机网络命名空间
    # 优点�?    #   1. 容器可以直接访问宿主机上的服务（�?Gateway�?    #   2. 避免端口映射的复杂�?    #   3. 性能更好（无额外网络层）
    # 注意：使�?host 模式后，ports 配置无效
    # -------------------------------------------------------------------------
    network_mode: host

    # -------------------------------------------------------------------------
    # 端口映射（仅�?network_mode �?default 时生效）
    # 如果你想�?bridge 模式而不�?host 模式，注释上面一行，取消下面注释
    # -------------------------------------------------------------------------
    # ports:
    #   - "1420:1420"      # EvoPanel Web 界面

    # -------------------------------------------------------------------------
    # 卷挂�?- 数据持久�?    # -------------------------------------------------------------------------
    volumes:
      # EvoPanel 配置目录 - 关键�?      # 包含 evopanel.json, mcp.json, agents/, devices/ �?      - ~/.evopanel:/root/.evopanel
      # EvoPanel 数据目录（可选，用于存储临时文件�?      - ./data:/app/data

    # -------------------------------------------------------------------------
    # 环境变量
    # -------------------------------------------------------------------------
    environment:
      - NODE_ENV=production
      # EvoPanel Gateway 地址（如�?Gateway 不在本地，修改为实际地址�?      # 注意：host 模式下直接使�?localhost �?127.0.0.1
      - EVOFLOW_GATEWAY_URL=http://127.0.0.1:18789
      # 双容器模式下禁止面板自动启动 Gateway（取消注释）
      # - DISABLE_GATEWAY_SPAWN=1
      # 如果需要代理（取消注释并修改为实际代理地址�?      # - HTTP_PROXY=http://host.docker.internal:7890
      # - HTTPS_PROXY=http://host.docker.internal:7890
      # 时区设置
      - TZ=Asia/Shanghai
      # 确保 HOME 环境变量正确
      - HOME=/root

    # -------------------------------------------------------------------------
    # 重启策略
    # -------------------------------------------------------------------------
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # 健康检�?    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1420/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # -------------------------------------------------------------------------
    # 安全配置
    # -------------------------------------------------------------------------
    # 使用读安全选项减少攻击�?    security_opt:
      - no-new-privileges:true

    # -------------------------------------------------------------------------
    # 资源限制（可选，取消注释以限制资源使用）
    # -------------------------------------------------------------------------
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1.0'
    #       memory: 1G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

    # -------------------------------------------------------------------------
    # 日志配置
    # -------------------------------------------------------------------------
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # -------------------------------------------------------------------------
    # 依赖（可选，如果 Gateway 在另一个容器中�?    # -------------------------------------------------------------------------
    # depends_on:
    #   gateway:
    #     condition: service_healthy

  # ---------------------------------------------------------------------------
  # EvoPanel Gateway 服务（可选，取消注释以启用）
  # ---------------------------------------------------------------------------
  # gateway:
  #   image: node:22-alpine
  #   container_name: evopanel-gateway
  #   hostname: evopanel-gateway
  #   network_mode: host
  #   volumes:
  #     - ~/.evopanel:/root/.evopanel
  #   environment:
  #     - TZ=Asia/Shanghai
  #   restart: unless-stopped
  #   command: >
  #     sh -c "（按需安装 Gateway CLI，命令以主仓库文档为准）&& gateway start --foreground"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #   logging:
  #     driver: "json-file"
  #     options:
  #       max-size: "10m"
  #       max-file: "3"

# =============================================================================
# 网络配置（使�?host 模式时不需要）
# =============================================================================
# networks:
#   default:
#     name: evopanel-network
#     driver: bridge

# =============================================================================
# 卷配�?# =============================================================================
# volumes:
#   evopanel-config:
#     name: evopanel-evopanel-config
