[project]
name = "evo-flow"
version = "1.0.0"
description = "EvoFlow Gateway — Agent Runtime API and control plane for long-running Agent Teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "evoflow-harness",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "aiohttp>=3.9.0",
    "certifi>=2024.0.0",
    "cryptography>=41.0.0",
    "qrcode>=7.0",
    "langgraph-sdk>=0.1.51",
    "markdown-to-mrkdwn>=0.3.1",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0", "ruff>=0.14.11", "pyinstaller>=6.16.0"]

[tool.uv.workspace]
members = ["packages/harness"]

[tool.uv.sources]
evoflow-harness = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: small unit-scoped tests (e.g. router handlers)",
    "tasks: tests for tasks API / router",
    "playwright: real Chromium via Playwright (needs `playwright install chromium` and network)",
]
filterwarnings = [
    "ignore:datetime\\.datetime\\.utcfromtimestamp\\(\\) is deprecated:DeprecationWarning",
    "ignore:.*InvalidStatusCode is deprecated.*:DeprecationWarning",
    "ignore:.*websockets\\.legacy is deprecated.*:DeprecationWarning",
    "ignore:.*deprecated method findAll.*:DeprecationWarning",
    "ignore::DeprecationWarning:lark_oapi",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
