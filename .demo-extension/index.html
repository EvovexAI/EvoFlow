<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EvoFlow 扩展挂载测试</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: radial-gradient(1200px 600px at 20% 0%, #1e3a8a 0%, #0f172a 45%, #020617 100%);
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        border-radius: 18px;
        padding: 32px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #93c5fd;
        border: 1px solid rgba(147, 197, 253, 0.35);
        border-radius: 999px;
        padding: 5px 12px;
      }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.35 } }
      h1 { font-size: 26px; margin: 18px 0 8px; line-height: 1.25; }
      p.lead { color: #94a3b8; margin: 0 0 24px; line-height: 1.6; }
      .rows { display: grid; gap: 10px; }
      .row {
        display: flex; justify-content: space-between; gap: 12px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgba(15, 23, 42, 0.55);
        border: 1px solid rgba(148, 163, 184, 0.16);
        font-size: 14px;
      }
      .row span:first-child { color: #94a3b8; }
      .row span:last-child { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: #f1f5f9; }
      button {
        margin-top: 22px; width: 100%;
        padding: 12px 16px; border-radius: 10px; border: 0;
        background: linear-gradient(135deg, #3b82f6, #6366f1);
        color: white; font-size: 15px; font-weight: 600; cursor: pointer;
        transition: transform .12s ease, box-shadow .12s ease;
      }
      button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(59,130,246,.35); }
      button:active { transform: translateY(0); }
      #stamp { margin-top: 14px; font-size: 13px; color: #86efac; min-height: 18px; text-align: center; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge"><i class="dot"></i> Agent 应用已挂载</div>
      <h1>挂载成功 ✅</h1>
      <p class="lead">
        这个页面由 EvoFlow 的 Agent 应用（UI Extension）加载，用于验证「安装 → 侧栏可见 → 正常渲染」整条链路。
      </p>

      <div class="rows">
        <div class="row"><span>扩展 ID</span><span>demo-hello</span></div>
        <div class="row"><span>渲染方式</span><span>webview (iframe)</span></div>
        <div class="row"><span>托管来源</span><span>本地静态服务</span></div>
        <div class="row"><span>加载时间</span><span id="ts">—</span></div>
      </div>

      <button id="ping">点我验证交互正常</button>
      <div id="stamp"></div>
    </main>

    <script>
      const now = new Date();
      document.getElementById('ts').textContent = now.toLocaleString('zh-CN', { hour12: false });
      const stamp = document.getElementById('stamp');
      let n = 0;
      document.getElementById('ping').addEventListener('click', () => {
        n += 1;
        stamp.textContent = `已点击 ${n} 次 · 页面 JS 运行正常`;
      });
    </script>
  </body>
</html>
